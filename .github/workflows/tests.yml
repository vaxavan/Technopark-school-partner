name: Тесты

on:
  push:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: technopark
          POSTGRES_USER: technopark
          POSTGRES_PASSWORD: technopark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U technopark" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Тесты на SQLite
        run: pytest
      - name: Тесты на PostgreSQL
        run: pytest
        env:
          TEST_WITH_POSTGRES: "1"
          POSTGRES_HOST: localhost
          POSTGRES_DB: technopark
          POSTGRES_USER: technopark
          POSTGRES_PASSWORD: technopark
