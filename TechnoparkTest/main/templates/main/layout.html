{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link  rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/fontawesome.min.css">
    <link  rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.1/css/all.css">

</head>
<body>
    <aside>
        <img src ="{% static 'main/img/PISH.png' %}" alt = "Лого">
        <span class="logo">Технопарк<br> "Исток - РТУ МИРЭА"</span>
        <ul>
            <li><a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Главная</a></li>
            <li><a href="{% url 'about' %}"><i class="fa-solid fa-handshake"></i> Про нас</a></li>
            <li><a href=""><i class="fa-solid fa-address-book"></i> Контакты</a></li>

        </ul>
    </aside>
    <main>
    {% block content %}
    {% endblock %}
    </main>
</body>
</html>
