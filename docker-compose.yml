# Запуск:  docker compose up -d --build
# Открыть: http://localhost:8000 (порт меняется переменной HTTP_PORT в .env)
x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_DB: technopark
    POSTGRES_USER: technopark
    POSTGRES_PASSWORD: technopark
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /app/media
    CELERY_TASK_ALWAYS_EAGER: "0"
    INTERNAL_SITE_URL: http://nginx
  volumes:
    - media:/app/media
  depends_on:
    - db
    - redis
  restart: unless-stopped

services:
  web:
    <<: *app
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: technopark
      POSTGRES_USER: technopark
      POSTGRES_PASSWORD: technopark
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      CELERY_TASK_ALWAYS_EAGER: "0"
      INTERNAL_SITE_URL: http://nginx
      RUN_MIGRATIONS: "1"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/media:ro
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: technopark
      POSTGRES_USER: technopark
      POSTGRES_PASSWORD: technopark
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  media:
