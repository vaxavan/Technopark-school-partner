# за Caddy сохраняем исходный протокол (https), без него — свой
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 30m;

    # настоящий адрес посетителя: за Caddy (внутренняя сеть Docker) берём его из X-Forwarded-For,
    # причём только последнюю запись, добавленную доверенным прокси — подставленные посетителем игнорируются
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /media/ {
        alias /media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
    }
}
